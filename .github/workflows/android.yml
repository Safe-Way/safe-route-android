# 앱 CI/CD: PR마다 빌드·단위 시험, main에 올라오면(PR 머지) 시험용 APK만 만들어 남긴다.
# main 푸시 때는 단위 시험을 건너뛴다: 같은 변경을 PR에서 이미 시험함. APK는 3일만 남긴다(최신 것만 필요).
#   비공개 저장소 Actions 무료 시간(조직 합쳐 월 2,000분)·저장 공간(0.5GB)을 11월에 다 써서 줄임 (2026-11-23, APK 36MB × 70개 = 2.6GB)
# 키는 저장소에 넣지 않는다. local.properties는 여기서 만들고, 카카오 키는 Secrets에 있을 때만 넣는다.
# 제미나이 키는 앱에 넣지 않는다 (서버 /api/ai/* 를 부름, 서버 #119·앱 #97).
name: 앱 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: 앱 빌드·단위 시험
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 빌드할 때마다 versionCode가 올라가게 (서버 업데이트 안내 GET /api/app/version이 이 번호로 비교)
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 라이선스 동의 (compileSdk 37을 받을 수 있게)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: local.properties 만들기
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          echo "SERVER_BASE_URL=https://safe-route.java21.net" > local.properties
          if [ -n "$KAKAO_NATIVE_APP_KEY" ]; then
            echo "KAKAO_NATIVE_APP_KEY=$KAKAO_NATIVE_APP_KEY" >> local.properties
          fi

      - name: Gradle 받기 (받는 곳이 잠깐 안 될 때를 대비해 3번까지)
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle 받기 실패, 60초 뒤 다시 ($i/3)"; sleep 60
          done
          exit 1

      - name: 단위 시험
        if: github.event_name != 'push'
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 시험용 APK 만들기
        run: ./gradlew --no-daemon assembleDebug

      - name: 시험 결과 남기기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: APK 남기기 (main일 때)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
