# 앱·서버 연결 검사 (매일 아침).
# 운영 서버(https://safe-route.java21.net)에서 앱이 부르는 조회 응답을 새로 받아(scripts/capture_contract.sh),
# 앱의 진짜 읽기 코드로 읽어 본다(ServerContractTest). 서버 응답 이름이 바뀌어 앱이 조용히 잘못 읽게 되면 여기서 걸린다.
# - 깨지면: 이 실행이 빨갛게 되고 'contract-broken' 이슈를 하나 연다(이미 열려 있으면 댓글). 받은 응답은 실행 기록에 남긴다.
# - 다시 맞으면: 열린 이슈에 시각을 남기고 닫는다.
# - 저장소에 있는 응답 파일은 그대로 둔다 (앱 PR 때는 앱 CI가 그 파일로 같은 시험을 돌린다).
# 서버가 일부러 이름을 바꿨다면: 앱 읽기 코드와 ServerContractTest 의 표를 고치고, 스크립트로 응답 파일을 새로 받아 PR.
#
# 참고
# - 예약 실행은 기본 브랜치(main)에 있는 이 파일로만 돈다.
# - 하루 한 번이라 Actions 시간이 적게 든다 (약 5분 × 30일).
# - /api/transit 은 서버의 ODsay 하루 호출 수를 1 올린다. DB에 쓰는 주소와 제미나이 주소는 부르지 않는다.
name: 앱·서버 연결 검사

on:
  schedule:
    # 한국 시간 매일 9시 10분 (UTC 0시 10분). 서버 상태 감시(9시~)가 먼저 돈 뒤
    - cron: '10 0 * * *'
  # Actions 탭에서 손으로 돌려 볼 수 있다 (서버를 배포한 뒤 등)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: contract
  cancel-in-progress: false

jobs:
  contract:
    name: 운영 서버 응답을 앱 코드로 읽기
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SERVER: ${{ vars.SERVER_BASE_URL || 'https://safe-route.java21.net' }}
      LABEL: contract-broken
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 라이선스 동의 (compileSdk 37을 받을 수 있게)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: local.properties 만들기 (단위 시험만 돌려서 카카오 키는 필요 없음)
        run: echo "SERVER_BASE_URL=$SERVER" > local.properties

      - name: Gradle 받기 (받는 곳이 잠깐 안 될 때를 대비해 3번까지)
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle 받기 실패, 60초 뒤 다시 ($i/3)"; sleep 60
          done
          exit 1

      - name: 운영 서버 응답 받기
        id: capture
        run: bash scripts/capture_contract.sh "$SERVER" app/src/test/resources/contract

      - name: 앱 코드로 읽어 보기
        id: test
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.deungbul.anshimgil.data.server.ServerContractTest'

      - name: 받은 응답·시험 결과 남기기 (실패했을 때)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ github.run_id }}
          path: |
            app/src/test/resources/contract/
            app/build/reports/tests/
          retention-days: 14

      # 깨짐: 열린 이슈가 없으면 열고, 있으면 댓글
      - name: 이슈 열기
        if: failure()
        run: |
          now="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          if [ "${{ steps.capture.outcome }}" = "failure" ]; then
            why="운영 서버 응답을 받지 못했어요 (200이 아니거나 JSON이 아님). 서버가 내려갔거나 주소·요청 형식이 바뀌었을 수 있어요."
          elif [ "${{ steps.test.outcome }}" = "failure" ]; then
            why="운영 서버 응답을 앱 코드로 읽었더니 맞지 않아요. 서버 응답 이름이나 값이 바뀌었을 수 있어요."
          else
            echo "준비 단계(Gradle·SDK)에서 실패: 서버 문제가 아니라 이슈는 열지 않아요"
            exit 0
          fi
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create "$LABEL" --color d73a4a --description "앱·서버 연결 검사(contract.yml)가 연 이슈" 2>/dev/null || true
          open="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh issue create --label "$LABEL" --title "앱·서버 연결 검사가 깨졌어요 ($now)" --body "$(printf '%s\n\n' \
              "$now(한국 시간) $why" \
              "실행 기록: $run (어느 이름이 없는지는 '앱 코드로 읽어 보기' 단계, 받은 응답은 contract-${GITHUB_RUN_ID} 파일)" \
              "고치는 법: 서버가 잘못 바뀐 것이면 서버를 되돌리고, 일부러 바꾼 것이면 앱 읽기 코드와 ServerContractTest 의 표를 고친 뒤 scripts/capture_contract.sh 로 응답 파일을 새로 받아 PR." \
              "다시 맞으면 이 이슈는 자동으로 닫혀요.")"
          else
            gh issue comment "$open" --body "$now 아직 깨져 있어요. $run"
          fi

      # 맞음: 열린 이슈가 있으면 닫는다
      - name: 이슈 닫기
        if: success()
        run: |
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 다시 맞아요. 자동으로 닫아요."
          done
